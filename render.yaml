# =============================================================================
# Doc-mate — Render Blueprint (primary backend host)
# =============================================================================
# Deploys the FastAPI backend as a Docker web service and (optionally) a
# managed Postgres. Frontend is deployed separately on Vercel.
#
# How to use:
#   1. Push this repo to GitHub/GitLab.
#   2. Render Dashboard -> "New" -> "Blueprint" -> pick this repo. Render reads
#      this file and provisions the service(s) below.
#   3. Fill the env vars marked `sync: false` (secrets) in the dashboard.
#   4. After first deploy, run migrations + seed against the prod DB
#      (see docs/DEPLOYMENT.md) so `CREATE EXTENSION vector` is applied.
#
# pgvector NOTE: the `docmate-db` managed Postgres below supports the pgvector
# extension, but it is NOT enabled by default. Our Alembic migration 0001 runs
# `CREATE EXTENSION IF NOT EXISTS vector`, so running `alembic upgrade head`
# enables it. If you prefer Neon or Supabase instead, delete the `databases:`
# block, remove the `fromDatabase` mapping on DATABASE_URL below, mark it
# `sync: false`, and paste your managed connection string in the dashboard.
# The URL MUST use the SQLAlchemy driver prefix: postgresql+psycopg://
# -----------------------------------------------------------------------------

services:
  - type: web
    name: docmate-backend
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Render load-balances to the port in $PORT; the app + Dockerfile honor it.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # --- App ---------------------------------------------------------------
      - key: APP_NAME
        value: Doc-mate
      - key: ENVIRONMENT
        value: production
      # Number of Uvicorn workers (matches Dockerfile default). Tune per plan.
      - key: WEB_CONCURRENCY
        value: "2"
      # CORS: set to your Vercel URL(s), comma-separated, once the frontend is
      # deployed. Example: https://doc-mate.vercel.app
      - key: CORS_ORIGINS
        sync: false

      # --- Database ----------------------------------------------------------
      # Pulled from the managed Postgres below. If you use Neon/Supabase
      # instead, replace this entry with `sync: false` and paste the URL
      # (must start with postgresql+psycopg://).
      - key: DATABASE_URL
        fromDatabase:
          name: docmate-db
          property: connectionString

      # --- Auth (secrets) ----------------------------------------------------
      # Generate a strong random value (e.g. `openssl rand -hex 32`).
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRY
        value: "1440"

      # --- Object storage (S3-compatible: Cloudflare R2 / Supabase) ----------
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_REGION
        value: auto

      # --- LLM layer ---------------------------------------------------------
      # Leave LLM_PROVIDER empty to run in deterministic STUB mode (no key
      # needed). To use a real provider, set LLM_PROVIDER + model names and add
      # the matching <PROVIDER>_API_KEY as a secret env var in the dashboard
      # (e.g. OPENAI_API_KEY / GEMINI_API_KEY).
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_MODEL_MULTIMODAL
        sync: false
      - key: LLM_MODEL_REASONING
        sync: false
      - key: EMBEDDING_MODEL
        sync: false
      - key: EMBEDDING_DIM
        value: "1536"

# Managed Postgres. Delete this block if you provision Neon/Supabase instead.
databases:
  - name: docmate-db
    plan: basic-256mb
    postgresMajorVersion: "16"
